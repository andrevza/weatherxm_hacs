name: Feature request
description: Suggest an improvement to WeatherXM Gateway Local.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: >-
        Check existing issues first. Do not include gateway IDs, network
        details, credentials, or private location information.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your use case and what is difficult today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the behavior or feature you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional approaches or workarounds you have considered.
    validations:
      required: false
