name: Bug report
description: Report a reproducible problem with WeatherXM Gateway Local.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: >-
        Before submitting, update to the latest integration version if practical
        and check existing issues. Review everything you share: remove gateway
        or station IDs, MAC addresses, IP addresses, hostnames, Wi-Fi names,
        credentials, and location details. Downloaded diagnostics are redacted,
        but should still be reviewed before posting.

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.4"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: Find this under Settings → Devices & services → Integrations.
      placeholder: "0.2.0"
    validations:
      required: true

  - type: input
    id: firmware_version
    attributes:
      label: WG1200 firmware version
      description: Find this in the integration's Gateway firmware diagnostic entity or gateway interface.
      placeholder: "0.8.x"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the affected entity or endpoint, if relevant.
      placeholder: Describe the problem and when it occurs.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics or relevant logs
      description: >-
        Attach or paste only the relevant excerpt. Use Download diagnostics
        where useful, then inspect and redact it before sharing. Never upload
        raw production captures.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this report and removed private gateway, station, network, and location details.
          required: true
